plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'jacoco'
}

android {
    namespace 'ru.ibakaidov.distypepro'
    compileSdk 36

    defaultConfig {
        applicationId "ru.ibakaidov.distypepro"
        minSdk 23
        targetSdk 36
        versionCode 64
        versionName "4.5.3"

        buildConfigField "String", "BACKEND_URL", "\"https://backend.linka.su\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        unitTests {
            includeAndroidResources = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    buildToolsVersion '35.0.1'
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        '**/databinding/**',
        '**/di/**'
    ]
    def debugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation project(':shared')

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'

    implementation 'com.google.dagger:hilt-android:2.56'
    ksp 'com.google.dagger:hilt-compiler:2.56'

    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:5.2.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.2.21'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.56'
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
    kspAndroidTest 'com.google.dagger:hilt-compiler:2.56'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}

tasks.register('verifyReleasePrivacy') {
    // Verify the final application manifest, including dependency contributions.
    dependsOn 'processReleaseManifest'

    doLast {
        def manifests = fileTree("$buildDir/intermediates").matching {
            include '**/merged_manifest/**/AndroidManifest.xml'
            include '**/merged_manifests/**/AndroidManifest.xml'
        }.files.findAll { manifest ->
            manifest.path.contains("${File.separator}release${File.separator}")
        }
        if (manifests.isEmpty()) {
            throw new GradleException('Release merged manifest was not generated')
        }

        manifests.each { manifest ->
            def manifestText = manifest.getText('UTF-8').toLowerCase()
            if (manifestText.contains('firebase_analytics') || manifestText.contains('firebase.analytics')) {
                throw new GradleException('Release manifest must not contain Firebase Analytics')
            }
            if (manifestText.contains('crashlytics')) {
                throw new GradleException('Release manifest must not contain Crashlytics')
            }
        }

        def crashlyticsComponents = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.id.displayName.toLowerCase().contains('crashlytics')
        }
        if (!crashlyticsComponents.isEmpty()) {
            throw new GradleException("Crashlytics must not be present in releaseRuntimeClasspath: ${crashlyticsComponents}")
        }
        def analyticsComponents = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.id.displayName.toLowerCase().contains('firebase-analytics')
        }
        if (!analyticsComponents.isEmpty()) {
            throw new GradleException("Firebase Analytics must not be present in releaseRuntimeClasspath: ${analyticsComponents}")
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyReleasePrivacy'
}
